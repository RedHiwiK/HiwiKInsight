name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build dashboard
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir=hiwikinsight_${GITHUB_REF_NAME}_${os}_${arch}
            mkdir -p "$dir"
            for cmd in hiwikinsight insight; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$dir/$cmd" ./cmd/$cmd
            done
            cp LICENSE README.md examples/config.example.yaml "$dir/"
            tar -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/redhiwik/hiwikinsight:${{ github.ref_name }}
            ghcr.io/redhiwik/hiwikinsight:latest
