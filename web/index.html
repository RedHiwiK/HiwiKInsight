<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/favicon.svg" />
    <title>HiwiKInsight</title>
    <script>
      // Apply the theme before the first frame to avoid a white flash
      try { var t = localStorage.getItem('hi-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
